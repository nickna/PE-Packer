name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Guards against a project being added to the repo but never wired into the
      # solution, which would silently exclude it from the test run below.
      - name: Ensure the test project is in the solution
        run: dotnet sln PE-Packer.slnx list | grep -q 'PEPacker.Tests.csproj'

      - name: Restore dependencies
        run: dotnet restore PE-Packer.slnx

      - name: Build
        run: dotnet build PE-Packer.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test PE-Packer.slnx --no-build --configuration Release --verbosity normal

      # PEPacker is published inside Native AOT applications, so it has to stay free of
      # trim/AOT analyzer warnings. It is at zero; without this an ordinary PR can
      # reintroduce a blocker silently, since the warnings are only visible to consumers
      # at their publish time.
      #
      # --no-incremental is load-bearing: analyzer warnings are emitted only when the
      # compiler actually runs, so an up-to-date build reports nothing and would let this
      # pass vacuously. Matching on the IL prefix rather than a list of codes means a
      # warning class we have not seen yet still fails.
      - name: AOT analyzer ratchet
        run: |
          set -o pipefail
          dotnet build src/PEPacker/PEPacker.csproj --no-restore --configuration Release \
            --no-incremental 2>&1 | tee analyzer-build.log
          if grep -E "warning IL[0-9]+" analyzer-build.log; then
            echo "::error::New trim/AOT analyzer warnings above. PEPacker must stay AOT-clean; \
          suppress with [UnconditionalSuppressMessage] and a justification only when the \
          warning is provably inapplicable."
            exit 1
          fi
          echo "No trim/AOT analyzer warnings."

  # The in-process suite above can never be AOT: it loads emitted assemblies in-process, so it
  # has to stay managed. That leaves the whole "works under JIT, breaks under AOT" class
  # invisible to it -- Assembly.LoadFrom failing, RuntimeEnvironment.GetRuntimeDirectory()
  # returning the app's own directory. This job publishes a real native binary and drives
  # PEPacker through it.
  #
  # It also runs on Linux, so it is the only coverage of the non-Windows paths (execute-bit
  # setting, dotnet-root probing, apphost naming without .exe).
  aot-smoke:
    name: aot-smoke (linux-x64, native)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # ILC shells out to a C++ linker; without these the link step fails rather than the
      # test failing, which is a confusing way to learn the toolchain is incomplete.
      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish the smoke host as Native AOT
        run: |
          dotnet publish tests/PEPacker.AotSmoke/PEPacker.AotSmoke.csproj \
            --configuration Release -r linux-x64

      # The host prints one line per check and exits non-zero if any required step failed, so
      # the log says what was covered rather than only whether it passed.
      - name: Run the smoke host
        run: ./tests/PEPacker.AotSmoke/bin/Release/net10.0/linux-x64/publish/PEPacker.AotSmoke
