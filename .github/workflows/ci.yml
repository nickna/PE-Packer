name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Guards against a project being added to the repo but never wired into the
      # solution, which would silently exclude it from the test run below.
      - name: Ensure the test project is in the solution
        run: dotnet sln PE-Packer.slnx list | grep -q 'PEPacker.Tests.csproj'

      - name: Restore dependencies
        run: dotnet restore PE-Packer.slnx

      - name: Build
        run: dotnet build PE-Packer.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test PE-Packer.slnx --no-build --configuration Release --verbosity normal
